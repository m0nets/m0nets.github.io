title: "pit notes & reviews"
author: "by monet"
description: "local london skramz, emo, punk, hardcore, p-hardcore gig highlights and reviews"
#########################################################################################
theme: "minima"

rss: rss

kramdown:
  syntax_highlighter_opts:
    disable: true
    
plugins:
  - jekyll-feed
  - jekyll-sitemap

titles_from_headings:
  strip_title: true
  collections: true

defaults:
  - scope:
      path: ""
      type: post
    values:
      tags: Other
sass:
  style: compressed
