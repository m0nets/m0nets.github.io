<style>
  #share-buttons {
    display: inline-block;
    vertical-align: middle;
  }

  #share-buttons:after {
    content: "";
    display: block;
    clear: both;
  }

  #share-buttons > div {
    position: relative;
    text-align: center;
    height: 36px;
    width: 32px;
    float: left;
  }

  /* all icons inside buttons */
  #share-buttons > div > svg {
    width: 16px;
    height: 16px;
    fill: #d5d5d5;
    margin-top: 10px;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }

  /* FIRST standalone SVG (your main share icon) */
  #share-buttons > svg {
    width: 16px;
    height: 16px;
    fill: #d5d5d5;
    vertical-align: middle;
    display: inline-block;
    margin-top: 10px;
  }

  #share-buttons > div:hover {
    cursor: pointer;
  }

  /* email icon tweak */
  #share-buttons > div.mail > svg {
    width: 14px;
    height: 14px;
    margin-top: 11px;
  }
</style>

{% assign safeurl = site.url | append: page.url | url_encode %}
{% assign safetitle = page.title | url_encode %}
{% assign safetitlepre = "[Blog] " | append: page.author | append: " - " | url_encode %}

<span style="color: silver;">share on: </span>

<div id="share-buttons">
  
  <!-- main share icon -->
  <svg viewBox="0 0 2304 1792" xmlns="http://www.w3.org/2000/svg">
    <path d="M1437 913q0 208-87 370.5t-248 254-369 91.5q-149 0-285-58t-234-156-156-234-58-285 58-285 156-234 234-156 285-58q286 0 491 192l-199 191q-117-113-292-113-123 0-227.5 62t-165.5 168.5-61 232.5 61 232.5 165.5 168.5 227.5 62q83 0 152.5-23t114.5-57.5 78.5-78.5 49-83 21.5-74h-416v-252h692q12 63 12 122zm867-122v210h-209v209h-210v-209h-209v-210h209v-209h210v209h209z"/>
  </svg>

  <!-- email -->
  <div class="mail"
       title="share on email"
       onclick="window.open('mailto:?&body={{ safeurl }}&subject={{ safetitlepre }}{{ safetitle }}','popup','width=600,height=600'); return false;">
    <svg viewBox="0 0 1792 1792" xmlns="http://www.w3.org/2000/svg">
      <path d="M1792 710v794q0 66-47 113t-113 47h-1472q-66 0-113-47t-47-113v-794q44 49 101 87 362 246 497 345 57 42 92.5 65.5t94.5 48 110 24.5h2q51 0 110-24.5t94.5-48 92.5-65.5q170-123 498-345 57-39 100-87zm0-294q0 79-49 151t-122 123q-376 261-468 325-10 7-42.5 30.5t-54 38-52 32.5-57.5 27-50 9h-2q-23 0-50-9t-57.5-27-52-32.5-54-38-42.5-30.5q-91-64-262-182.5t-205-142.5q-62-42-117-115.5t-55-136.5q0-78 41.5-130t118.5-52h1472q65 0 112.5 47t47.5 113z"/>
    </svg>
  </div>

</div>
